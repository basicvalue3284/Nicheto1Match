<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TubeFlow Thumbnail Maker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <div class="topbar">
          <div>
            <h1>TubeFlow Thumbnail Maker</h1>
            <p>Generate 1280x720 YouTube thumbnails from a reusable template.</p>
          </div>
          <button id="downloadBtn" class="primary-button" type="button">Download PNG</button>
        </div>

        <div class="canvas-frame">
          <canvas id="thumbnailCanvas" width="1280" height="720" aria-label="Thumbnail preview"></canvas>
        </div>
      </section>

      <aside class="controls" aria-label="Thumbnail controls">
        <div class="panel-section">
          <h2>Text</h2>
          <label>
            Main yellow word
            <input id="headlineInput" type="text" value="COMBINE" maxlength="22" />
          </label>
          <label>
            White line
            <input id="subheadlineInput" type="text" value="EMAIL" maxlength="28" />
          </label>
          <label>
            Small badge text
            <input id="badgeInput" type="text" value="QUICK GUIDE" maxlength="24" />
          </label>
        </div>

        <div class="panel-section">
          <h2>Images</h2>
          <label>
            Person cutout PNG
            <input id="personInput" type="file" accept="image/*" />
          </label>
          <label>
            Logo or app icon
            <input id="logoInput" type="file" accept="image/*" />
          </label>
          <label>
            Screen/app screenshot
            <input id="screenshotInput" type="file" accept="image/*" />
          </label>
        </div>

        <div class="panel-section">
          <h2>Template</h2>
          <label>
            Layout
            <select id="layoutInput">
              <option value="person-right">Person right</option>
              <option value="person-left">Person left</option>
            </select>
          </label>
          <label>
            Accent color
            <input id="accentInput" type="color" value="#ff0000" />
          </label>
          <label>
            Background tone
            <select id="backgroundInput">
              <option value="light">Light gray</option>
              <option value="white">Clean white</option>
              <option value="warm">Warm white</option>
            </select>
          </label>
        </div>

        <div class="panel-section">
          <h2>Quick Actions</h2>
          <button id="accessPreset" type="button">Access App Access</button>
          <button id="emailPreset" type="button">Combine Email</button>
          <button id="clearImages" type="button">Clear Images</button>
        </div>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
