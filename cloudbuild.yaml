steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nicheto1match:$COMMIT_SHA'
      - '.'

  # Push to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nicheto1match:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nicheto1match'
      - '--image=gcr.io/$PROJECT_ID/nicheto1match:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=3600'
      - '--max-instances=1'
      - '--min-instances=0'
      - '--set-env-vars=APP_USER=${_APP_USER},APP_PASS=${_APP_PASS},AI_PROVIDER=${_AI_PROVIDER},OPENAI_MODEL=${_OPENAI_MODEL},GEMINI_MODEL=${_GEMINI_MODEL},BATCH_SIZE=${_BATCH_SIZE},DATA_ROOT=/tmp/nicheto1match/data'

substitutions:
  _APP_USER: admin
  _APP_PASS: changeme-set-in-trigger
  _AI_PROVIDER: openai
  _OPENAI_MODEL: gpt-4o-mini
  _GEMINI_MODEL: gemini-1.5-flash
  _BATCH_SIZE: '25'

options:
  logging: CLOUD_LOGGING_ONLY
